services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rails:
    build: ./apps/rails-app
    command: >
      sh -c "rm -f tmp/pids/server.pid && (bundle check || bundle install) &&
      bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    volumes:
      - ./apps/rails-app:/app
      - rails_bundle:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY:-dev_insecure_jwt_secret_change_me}
      REACT_APP_ORIGIN: http://localhost:5173
      RAILS_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  react:
    build: ./apps/react-app
    volumes:
      - ./apps/react-app:/app
      - react_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - rails

volumes:
  postgres_data:
  rails_bundle:
  react_node_modules:
